<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>BLOOD & EARTH - Chat</title>

	<link rel="stylesheet" type="text/css" href="css/style.css" />
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head>

<!-- The chat in its own window. Opened by the "Pop out" button in index.html. -->
<body class="chat-popout-page">
	<div class="chat-head">
		<h3 class="grid-item-title">Chat</h3>
		<button type="button" class="chat-popout chat-dice-button" id="chatDice" title="Challenge someone to a game of dice">Dice</button>
	</div>
	<div class="chat-body">
	<div class="chat-log" id="chatLog" role="log" aria-live="polite"></div>
	<aside class="chat-online" aria-label="Players online">
		<h4 id="chatOnlineTitle">Online</h4>
		<ul id="chatOnlineList"></ul>
	</aside>
	</div>
	<form class="chat-form" id="chatForm" autocomplete="off">
		<input type="text" id="chatName" maxlength="20" aria-label="Your name" placeholder="Your name">
		<input type="text" id="chatInput" maxlength="300" aria-label="Message" placeholder="Say something…">
		<button type="submit" class="button" id="chatSend">Send</button>
	</form>
	<p class="chat-status" id="chatStatus" role="status"></p>

	<script type="module">
		import Chat from './js/chat/Chat.js';
		import GifPicker from './js/chat/GifPicker.js';
		import OnlinePlayers from './js/chat/OnlinePlayers.js';
		import { CHAT_API_URL, ONLINE_API_URL, GIPHY_API_KEY } from './js/chat/chatConfig.js';

		const chat = new Chat(CHAT_API_URL);

		// Use the vampire name from the game's save (same browser, same site)
		try {
			const save = JSON.parse(localStorage.getItem("save"));
			if (save && save.signedUp === true && save.vampireName) chat.lockName(save.vampireName);
		} catch { /* no readable save: the chat keeps its own name */ }

		chat.start();
		new OnlinePlayers(ONLINE_API_URL).start();
		new GifPicker(chat, GIPHY_API_KEY).start();
		document.getElementById("chatInput").focus();

		// Glow on the Dice button while a challenge is waiting: the game window knows, so ask it.
		function updateDiceGlow() {
			let waiting = 0;
			try {
				const game = window.opener && !window.opener.closed && window.opener.vampireGameDice;
				waiting = (game && game.waitingChallenges) || 0;
			} catch { /* the game window cannot be reached */ }
			const button = document.getElementById("chatDice");
			button.classList.toggle("dice-glow", waiting > 0);
			button.title = waiting > 0 ? "A dice challenge is waiting for you!" : "Challenge someone to a game of dice";
		}
		updateDiceGlow();
		setInterval(updateDiceGlow, 2000);

		// The dice game opens in its own window; it finds the game window through this one.
		document.getElementById("chatDice").addEventListener("click", () => {
			const popup = window.open("dice.html", "vampireHouseDice", "popup=yes,width=620,height=820");
			if (popup) popup.focus();
		});
	</script>
</body>

</html>
